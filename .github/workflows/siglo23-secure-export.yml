name: Exportar respaldo cifrado de Hostinger y restaurar PHP (sin datos en publico)
on:
  push:
    branches: [bridge/siglo23-v52-20261121]
    paths:
      - "bridge-v52/secure-export.py"
      - "bridge-v52/secure-restore.py"
      - ".github/workflows/siglo23-secure-export.yml"
permissions:
  contents: read
jobs:
  export_and_restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Obtener TAR cifrado, nunca el original en claro
        id: export
        run: python3 bridge-v52/secure-export.py
      - name: Restaurar archivos de Hostinger que falten despues del deploy
        if: always()
        run: python3 bridge-v52/secure-restore.py
      - name: Adjuntar respaldo cifrado como artifact temporal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siglo23-hostinger-encrypted-snapshot
          path: /tmp/siglo23-private-backup.encrypted
          if-no-files-found: warn
          retention-days: 1
