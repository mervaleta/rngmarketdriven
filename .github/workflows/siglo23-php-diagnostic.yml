name: Comprobar respaldo PHP sin descargar datos privados
on:
  push:
    branches: [bridge/siglo23-v52-20261121]
    paths:
      - "bridge-v52/php-diagnostic.py"
      - ".github/workflows/siglo23-php-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si existe respaldo Hostinger
        run: python3 bridge-v52/php-diagnostic.py
      - name: Guardar resultado sin datos personales
        if: always()
        run: |
          if [ -f bridge-v52/php-diagnostic-result.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bridge-v52/php-diagnostic-result.json
            git diff --cached --quiet || (git commit -m "Diagnostico de backup PHP de Hostinger" && git push)
          fi
