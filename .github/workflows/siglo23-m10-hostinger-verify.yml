name: Siglo23 - verificar publicacion de Spencer M11 y landing
on:
  workflow_dispatch:
  push:
    paths:
      - "publicdomain/spencer/maquetacion/**"
      - "publicdomain/estudio/**"
      - "siglo23/**"
      - ".github/workflows/siglo23-m10-hostinger-verify.yml"
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar rutas y recursos imprescindibles en Hostinger
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          required=[
            ('Spencer M11','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/index.html','M11 · EDICIÓN POR PÁGINA'),
            ('Compositor Paged.js','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/preprensa.html','Paged.js 0.4.3'),
            ('Vista con tapas','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/preprensa.html','Libro abierto · tapa, interior y contratapa'),
            ('Motor pliegos y cubiertas','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/preprensa.js?v=m11','createCover'),
            ('Estilos de pliegos contiguos','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/preprensa.css?v=2-pliegos','s23-spread-pages'),
            ('Editor por hoja','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/page-designer.js?v=m11','s23-edit-toggle'),
            ('Estilos de capas','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/page-designer.css?v=m11','s23-custom-text'),
            ('Motor JS','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/preprensa.js','new window.Paged.Previewer()'),
            ('Hojas CSS','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/preprensa.css','.pagedjs_pages'),
            ('Portal editorial','https://rngmarketdriven.com/publicdomain/estudio/index.html','Un estudio.'),
            ('Acceso corto Siglo23','https://rngmarketdriven.com/siglo23/index.html','Un estudio.')
          ]
          optional=[('Santoro y Donoso (repositorio actualizado, hosting independiente)','https://santoroydonoso.com/siglo23/index.html','Un estudio.')]
          fail=False
          for mandatory,targets in ((True,required),(False,optional)):
            for label,url,marker in targets:
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Siglo23-Publication-Verify/1.1','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=18) as resp:
                  text=resp.read(180000).decode('utf-8','replace')
                  ok=resp.status==200 and marker in text
                  print(('PUBLICADO' if ok else 'PENDIENTE'),label,'HTTP',resp.status,'marcador:',marker,flush=True)
                  if not ok and mandatory:fail=True
              except Exception as exc:
                print('PENDIENTE',label,type(exc).__name__,str(exc)[:140],flush=True)
                if mandatory:fail=True
          if fail:raise SystemExit('No se verificaron todas las rutas obligatorias de RNG Market Driven')
          PY
