name: Siglo23 - verificar publicacion de Spencer M10 y landing
on:
  workflow_dispatch:
  push:
    paths:
      - "publicdomain/spencer/maquetacion/**"
      - "publicdomain/estudio/**"
      - ".github/workflows/siglo23-m10-hostinger-verify.yml"
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Comprobar URLs externas, marcadores y respuestas HTTP
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          targets=[
            ('Spencer taller M10','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/index.html','M10 · PREPRENSA EXPERIMENTAL'),
            ('Spencer laboratorio Paged.js','https://rngmarketdriven.com/publicdomain/spencer/maquetacion/preprensa.html','Paged.js 0.4.3'),
            ('Estudio rngmarketdriven','https://rngmarketdriven.com/publicdomain/estudio/index.html','Un estudio.'),
            ('Estudio santoroydonoso','https://santoroydonoso.com/siglo23/index.html','Un estudio.'),
          ]
          failure=False
          for label,url,marker in targets:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Siglo23-Publication-Verify/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(100000).decode('utf-8','replace')
                ok=(r.status==200 and marker in body)
                print(('PUBLICADO' if ok else 'NO COINCIDE'),label,'HTTP',r.status,'marcador',marker,flush=True)
                if not ok: failure=True
            except Exception as e:
              failure=True
              print('NO VERIFICADO',label,type(e).__name__,str(e)[:200],flush=True)
          if failure: raise SystemExit('El repositorio está actualizado; Hostinger no confirmó todas las páginas')
          PY
