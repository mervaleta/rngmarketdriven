name: Publish Studio Style Lab 3D
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cross/minijuegos/style-lab/**'
      - 'cross/scripts/publish-style-lab.py'
      - 'cross/scripts/style-lab-smoke.mjs'
      - '.github/workflows/studio-style-lab.yml'
permissions:
  contents: write
concurrency:
  group: studio-style-lab-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned local editor
        run: python3 cross/scripts/publish-style-lab.py build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-style-lab-3d
          path: studio-release/cross/
          include-hidden-files: true
          retention-days: 7
      - name: Test actual browser startup and reset
        run: |
          export CHROME_BIN="$(which google-chrome || which chromium || which chromium-browser)"
          npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24
          php -S 127.0.0.1:8765 -t studio-release > /tmp/studio-style-http.log 2>&1 &
          sleep 2
          STUDIO_TEST_URL=http://127.0.0.1:8765/cross/minijuegos/style-lab/engine/editor/ node cross/scripts/style-lab-smoke.mjs
      - name: Version the reviewed engine assets in the repository
        run: |
          mkdir -p cross/minijuegos/style-lab/engine
          rsync -a studio-release/cross/minijuegos/style-lab/engine/ cross/minijuegos/style-lab/engine/
          git config user.name "studio-release[bot]"
          git config user.email "studio-release[bot]@users.noreply.github.com"
          git add -f cross/minijuegos/style-lab/engine/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor pinned Style Lab 3D engine and CC0 assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish Style Lab only over FTPS
        env:
          STUDIO_FTP_HOST: ${{ secrets.STUDIO_FTP_HOST || secrets.HOSTINGER_FTP_HOST || secrets.FTP_HOST }}
          STUDIO_FTP_USER: ${{ secrets.STUDIO_FTP_USER || secrets.HOSTINGER_FTP_USER || secrets.FTP_USER }}
          STUDIO_FTP_PASSWORD: ${{ secrets.STUDIO_FTP_PASSWORD || secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          STUDIO_FTP_ROOT: ${{ secrets.STUDIO_FTP_ROOT }}
          STUDIO_FTP_PORT: ${{ secrets.STUDIO_FTP_PORT }}
        run: |
          if [ -n "$STUDIO_FTP_HOST" ] && [ -n "$STUDIO_FTP_USER" ] && [ -n "$STUDIO_FTP_PASSWORD" ]; then
            python3 cross/scripts/publish-style-lab.py deploy
          else
            echo "::warning::FTPS not configured. Engine is versioned in main; Hostinger Git deployment must pull main."
          fi
      - name: Verify editor and compressed mesh response
        run: |
          python3 - <<'PY'
          import urllib.request
          base='https://rngmarketdriven.com/cross/minijuegos/style-lab/'
          def get(rel):
              with urllib.request.urlopen(base+rel,timeout=25) as r: return r.read()
          assert b'Style Lab 3D' in get('index.php?mode=duel')
          assert b'engine/editor/' in get('index.php')
          assert b'Studio' in get('engine/editor/index.html')
          assert get('engine/assets/base.bin.gz').startswith(b'\x1f\x8b')
          PY
