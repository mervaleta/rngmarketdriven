name: Verify public Ara Fashion Lab
on:
  workflow_run:
    workflows: ["Build Cross Ara Fashion Lab"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check published engine and live page
        run: python3 cross/scripts/verify-ara-public.py
