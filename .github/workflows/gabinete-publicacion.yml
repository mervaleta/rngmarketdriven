name: Gabinete - verificar publicacion en Hostinger

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gabinete-publicacion.yml"

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar version 1.1 y copias propias desde el dominio
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, urllib.request, urllib.error
          from pathlib import Path
          root="https://rngmarketdriven.com/publicdomain/gabinete/"
          files=json.loads(Path("publicdomain/gabinete/imagenes/manifest.json").read_text())["files"]
          def check(x):
              path=x["web"].lstrip("./")
              try:
                  req=urllib.request.Request(root+path,headers={"User-Agent":"EditorialSiglo23-Asset-Check/1.1"},method="HEAD")
                  with urllib.request.urlopen(req,timeout=18) as resp:
                      return (path,resp.status,resp.headers.get("Content-Type"),resp.headers.get("Content-Length"))
              except Exception as error:
                  return (path,str(error)[:100],None,None)
          with concurrent.futures.ThreadPoolExecutor(max_workers=7) as pool:
              results=list(pool.map(check,files))
          failures=[x for x in results if x[1]!=200 or not x[2] or "image" not in x[2]]
          print("FOTOS_LOCALES",len(results),"OK",len(results)-len(failures),"FALLIDAS",len(failures),flush=True)
          print("FALLOS",json.dumps(failures,ensure_ascii=False),flush=True)
          for path in ("version.json","index.html","imagenes/maestros/stereo.jpg"):
              try:
                  req=urllib.request.Request(root+path,headers={"User-Agent":"EditorialSiglo23-Asset-Check/1.1"})
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      data=resp.read(3_500_000 if "stereo.jpg" in path else 30_000)
                  if path=="version.json":
                      doc=json.loads(data)
                      print("SITIO_VERSION",doc.get("version"),"FOTOS_LOCALES",doc.get("localImageFiles"),"MASTERS",doc.get("metOriginalsDownloaded"))
                  elif path=="index.html":
                      print("HTML_V1.1",b"GABINETE" in data and b"V1.1.0" in data)
                  else:
                      orig=Path("publicdomain/gabinete/imagenes/maestros/stereo.jpg").read_bytes()
                      print("MASTER_SITIO_BYTES",len(data),"MASTER_REPO_BYTES",len(orig),
                            "MISMA_SHA256",hashlib.sha256(data).digest()==hashlib.sha256(orig).digest())
              except Exception as error:
                  print("ERROR_VERIFICACION",path,str(error)[:160])
          PY
