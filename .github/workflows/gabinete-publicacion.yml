name: Gabinete - verificar publicacion en Hostinger

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gabinete-publicacion.yml"

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar URL y algunos archivos locales
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          root="https://rngmarketdriven.com/publicdomain/gabinete/"
          paths=["version.json","index.html","imagenes/web/stereo.jpg",
                 "imagenes/web/belloc_sofa_1855.jpg","imagenes/maestros/stereo.jpg"]
          for path in paths:
              url=root+path
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"EditorialSiglo23-Deployment-Check/1.0"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      mime=response.headers.get("Content-Type","")
                      data=response.read(1500)
                      print(json.dumps({"path":path,"status":response.status,"content_type":mime,
                                        "bytes_available":response.headers.get("Content-Length"),
                                        "version_snippet":data.decode("utf8","replace")[:250] if path=="version.json" else None}))
              except Exception as error:
                  print(json.dumps({"path":path,"error":str(error)[:240]}))
          PY
