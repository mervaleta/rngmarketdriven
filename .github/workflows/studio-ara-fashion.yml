name: Build Cross Ara Fashion Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cross/scripts/ara-fashion-*'
      - 'cross/minijuegos/ara-fashion/garments/**'
      - '.github/workflows/studio-ara-fashion.yml'
permissions:
  contents: write
concurrency:
  group: studio-ara-fashion
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pinned upstream
        run: |
          git init /tmp/ara-fashion
          git -C /tmp/ara-fashion fetch --depth=1 https://github.com/olatunde85/3d-gen.git 025894503533e59fcaa4dd32e37f0c86f824618c
          git -C /tmp/ara-fashion checkout --detach FETCH_HEAD
      - name: Generate MakeHuman assets
        working-directory: /tmp/ara-fashion
        run: |
          npm ci
          npx tsx scripts/setup-assets.ts
      - name: Adapt wardrobe and approved imported garments
        run: |
          python3 cross/scripts/ara-fashion-patch.py /tmp/ara-fashion "$PWD/cross/minijuegos/ara-fashion/garments" /tmp/ara-fashion/vendor/sys/clothes
          cp cross/scripts/ara-fashion-check.ts /tmp/ara-fashion/scripts/cross-check.ts
          cd /tmp/ara-fashion
          if [ -d "$GITHUB_WORKSPACE/cross/minijuegos/ara-fashion/garments" ]; then npx tsx scripts/build-assets.ts; fi
          npm run typecheck
          npx tsx scripts/cross-check.ts
      - name: Build only the character editor
        working-directory: /tmp/ara-fashion
        run: |
          cat > vite.cross.config.ts <<'EOF'
          import { defineConfig } from 'vite';
          import { resolve } from 'node:path';
          export default defineConfig({
            base:'/cross/minijuegos/ara-fashion/engine/',
            worker:{format:'es'},
            build:{target:'es2022',rollupOptions:{input:{app:resolve(import.meta.dirname,'app/index.html')}}}
          });
          EOF
          npx vite build --config vite.cross.config.ts
          mkdir -p "$GITHUB_WORKSPACE/ara-release"
          cp -a dist/app dist/assets "$GITHUB_WORKSPACE/ara-release/"
          for folder in quick-thumbs picker-thumbs outfit-thumbs; do
            if [ -d "dist/$folder" ]; then cp -a "dist/$folder" "$GITHUB_WORKSPACE/ara-release/"; fi
          done
          cp LICENSE scripts/ASSETS_LICENSE.txt "$GITHUB_WORKSPACE/ara-release/"
          printf '%s\n' '025894503533e59fcaa4dd32e37f0c86f824618c' > "$GITHUB_WORKSPACE/ara-release/BUILD.txt"
      - name: Test browser startup
        run: |
          mkdir -p /tmp/ara-test/cross/minijuegos/ara-fashion
          ln -s "$PWD/ara-release" /tmp/ara-test/cross/minijuegos/ara-fashion/engine
          python3 -m http.server 8766 --bind 127.0.0.1 --directory /tmp/ara-test >/tmp/ara-http.log 2>&1 &
          npm install --prefix /tmp/ara-smoke --no-save --no-package-lock puppeteer-core@24
          cat > /tmp/ara-smoke/check.mjs <<'EOF'
          import puppeteer from 'puppeteer-core';
          import assert from 'node:assert/strict';
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{
            const page=await browser.newPage();
            page.on('pageerror',e=>console.error(e));
            await page.goto('http://127.0.0.1:8766/cross/minijuegos/ara-fashion/engine/app/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#loading')?.hidden&&document.querySelector('#stats')?.textContent.includes('tris'),{timeout:120000});
            assert.ok(await page.$('canvas'));
            console.log('Browser rendered avatar:',await page.$eval('#stats',x=>x.textContent));
          }finally{await browser.close()}
          EOF
          CHROME_BIN="$(which google-chrome || which chromium)" node /tmp/ara-smoke/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cross-ara-fashion
          path: ara-release/
      - name: Publish tested build to repository
        run: |
          mkdir -p cross/minijuegos/ara-fashion/engine
          rsync -a --delete ara-release/ cross/minijuegos/ara-fashion/engine/
          git config user.name 'studio-release[bot]'
          git config user.email 'studio-release[bot]@users.noreply.github.com'
          git add -f cross/minijuegos/ara-fashion/engine
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated Ara Fashion Lab engine'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
