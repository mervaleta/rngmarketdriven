name: Siglo23 Studio v2 - comprobar publicacion cinco talleres
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/siglo23-studio-v2-publicacion.yml"
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Estado HTTP de las cinco instalaciones
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          targets=[
           ("Spencer Kit","https://rngmarketdriven.com/publicdomain/spencer/maquetacion/estudio-comun.js?v=2.0","Siglo23 Studio Kit 2.0"),
           ("Gabinete Kit","https://rngmarketdriven.com/publicdomain/gabinete/estudio-comun.js?v=2.0","Siglo23 Studio Kit 2.0"),
           ("Camoati Kit","https://camoati.santoroydonoso.com/maquetacion/estudio-comun.js?v=2.0","Siglo23 Studio Kit 2.0"),
           ("Siglotimicos Kit","https://siglotimicos.santoroydonoso.com/maquetacion/estudio-comun.js?v=2.0","Siglo23 Studio Kit 2.0"),
           ("Voyager Kit","https://voyager.santoroydonoso.com/maquetacion/estudio-comun.js?v=2.0","Siglo23 Studio Kit 2.0"),
           ("Landing RNG","https://rngmarketdriven.com/siglo23/index.html","STUDIO V2"),
           ("Landing Santoro","https://santoroydonoso.com/siglo23/index.html","STUDIO V2")
          ]
          good=0
          for label,url,needle in targets:
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Siglo23-Studio-Verificacion/2.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(request,timeout=16) as res:
                payload=res.read(250000).decode("utf-8","replace")
                verified=res.status==200 and needle in payload
                print(("CONFIRMADO" if verified else "PENDIENTE"),label,"HTTP",res.status,flush=True)
                good+=verified
            except Exception as e:
              print("NO VERIFICADO",label,type(e).__name__,str(e)[:110],flush=True)
          print("RESUMEN: ",good,"de",len(targets),"rutas confirmadas; este diagnóstico no supone autorización ni despliegue automático",flush=True)
          PY
